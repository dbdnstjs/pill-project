# DB (Railway PostgreSQL 연동 시 PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD 자동 주입)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Seed Data (멱등성 보장 — 재실행 안전)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data/seed_kdri2025.sql

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# OpenAPI
openapi.secret-key=${OPENAPI_SECRET_KEY}

# AI Server
ai.server.url=${AI_SERVER_URL}
