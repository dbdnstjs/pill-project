version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: pill-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pill-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pill-redis
    ports:
      - "6379:6379"

volumes:
  pill-data: